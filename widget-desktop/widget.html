<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>do. widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      background: transparent !important
    }

    body {
      font-family: 'Inter', -apple-system, 'SF Pro Display', 'SF Pro Text', BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: transparent !important;
      color: #f5f5f0;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      user-select: none;
      overflow: hidden
    }

    #header {
      -webkit-app-region: drag
    }

    button,
    a,
    input {
      -webkit-app-region: no-drag
    }

    /* ── Liquid Glass Card ── */
    #card {
      width: 380px;
      position: relative;
      background: linear-gradient(145deg, rgba(14, 14, 14, 1), rgba(8, 8, 8, 1));
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 24px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(125, 200, 125, .08), 0 0 80px rgba(125, 200, 125, .04), 0 8px 32px rgba(0, 0, 0, .6)
    }

    /* Glass shimmer reflection */
    #card::before {
      content: '';
      position: absolute;
      top: -30%;
      left: -10%;
      width: 120%;
      height: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, .12) 0%, rgba(255, 255, 255, .04) 50%, transparent 100%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1
    }

    /* Frosted edge glow */
    #card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      pointer-events: none;
      z-index: 0;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .14),
        inset 0 -1px 0 rgba(0, 0, 0, .4),
        inset 0 0 40px rgba(125, 200, 125, .04),
        inset 0 0 80px rgba(255, 255, 255, .02)
    }

    #card>* {
      position: relative;
      z-index: 2
    }

    #header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      cursor: move;
      padding-bottom: 2px
    }

    #logo {
      font-size: 17px;
      font-weight: 600;
      color: #7dc87d;
      text-shadow: 0 0 12px rgba(125, 200, 125, .3)
    }

    #cursor-blink {
      display: inline-block;
      width: 6px;
      height: 12px;
      background: #7dc87d;
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 1.2s step-end infinite;
      box-shadow: 0 0 6px rgba(125, 200, 125, .4)
    }

    #date {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, .7);
      margin-top: 3px
    }

    #clock {
      font-size: 28px;
      font-weight: 300;
      color: rgba(255, 255, 255, .9);
      letter-spacing: -.03em;
      line-height: 1;
      text-align: right
    }

    #sync {
      font-size: 11px;
      color: rgba(255, 255, 255, .55);
      text-align: right;
      margin-top: 3px;
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      transition: color .2s
    }

    #sync:hover {
      color: #7dc87d
    }

    .ctrl-btn {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 0;
      transition: all .2s;
      box-shadow: 0 0 4px rgba(0, 0, 0, .3)
    }

    .ctrl-btn:hover {
      opacity: .8;
      transform: scale(1.15)
    }

    #btn-pin {
      background: radial-gradient(circle at 35% 35%, #f5d76e, #e8b84b)
    }

    #btn-hide {
      background: radial-gradient(circle at 35% 35%, #f08080, #e06c6c)
    }

    #btn-pin.active {
      background: radial-gradient(circle at 35% 35%, #a0e8a0, #7dc87d)
    }

    /* ── Glass Panels ── */
    .panel {
      background: linear-gradient(135deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .015));
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 12px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .1), transparent);
      pointer-events: none
    }

    .panel-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, .72);
      letter-spacing: .07em;
      text-transform: uppercase
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
      backdrop-filter: blur(4px)
    }

    .badge.warn {
      background: rgba(232, 184, 75, .12);
      color: #e8b84b;
      border: 1px solid rgba(232, 184, 75, .15)
    }

    .badge.done {
      background: rgba(125, 200, 125, .12);
      color: #7dc87d;
      border: 1px solid rgba(125, 200, 125, .15)
    }

    /* ── Quick-add ── */
    #add-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      background: linear-gradient(135deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .02));
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 10px;
      padding: 8px 10px;
      transition: border-color .2s
    }

    #add-bar:focus-within {
      border-color: rgba(125, 200, 125, .3)
    }

    #add-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #f5f5f0;
      font-family: inherit;
      font-size: 13px;
      font-weight: 400
    }

    #add-input::placeholder {
      color: rgba(255, 255, 255, .45)
    }

    #add-btn {
      background: none;
      border: none;
      color: #7dc87d;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      transition: all .2s
    }

    #add-btn:hover {
      opacity: .7;
      text-shadow: 0 0 8px rgba(125, 200, 125, .5)
    }

    #syntax-hint {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, .45);
      display: flex;
      gap: 8px;
      padding: 0 2px
    }

    /* ── Status ── */
    #status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, .7);
      padding: 0 2px
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px
    }

    .online .status-dot {
      background: #7dc87d;
      box-shadow: 0 0 6px rgba(125, 200, 125, .5)
    }

    .offline .status-dot {
      background: #e06c6c;
      box-shadow: 0 0 6px rgba(224, 108, 108, .5)
    }

    #queue-badge {
      color: #e8b84b
    }

    /* ── Progress ── */
    .prog-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, .72)
    }

    .prog-track {
      height: 3px;
      background: rgba(255, 255, 255, .05);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px
    }

    .prog-fill {
      height: 100%;
      border-radius: 2px;
      transition: width .7s ease;
      background: linear-gradient(90deg, #5a9e5a, #7dc87d);
      box-shadow: 0 0 8px rgba(125, 200, 125, .3)
    }

    /* ── Task Items ── */
    .task-item {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: all .2s
    }

    .task-item:hover {
      background: rgba(125, 200, 125, .06);
      box-shadow: inset 0 0 0 1px rgba(125, 200, 125, .06)
    }

    .task-item.done-item {
      cursor: default
    }

    .task-item.done-item:hover {
      background: transparent;
      box-shadow: none
    }

    .task-check {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1.5px solid rgba(255, 255, 255, .15);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      transition: all .2s
    }

    .task-item:hover .task-check {
      border-color: rgba(125, 200, 125, .5)
    }

    .task-item.completed .task-check {
      border-color: #7dc87d;
      background: #7dc87d;
      color: #0d0d0d;
      box-shadow: 0 0 6px rgba(125, 200, 125, .3)
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: rgba(255, 255, 255, .42)
    }

    .task-title {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, .92);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1
    }

    .task-pri {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .task-area {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, .65);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, .15);
      flex-shrink: 0
    }

    .task-section {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, .5);
      flex-shrink: 0
    }

    /* ── Glass Tab Bar ── */
    #tab-bar {
      display: flex;
      gap: 2px;
      background: rgba(0, 0, 0, .25);
      border-radius: 8px;
      padding: 2px;
      border: 1px solid rgba(255, 255, 255, .03)
    }

    .tab-btn {
      flex: 1;
      padding: 6px 0;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      background: transparent;
      color: rgba(255, 255, 255, .55);
      transition: all .25s
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .03));
      box-shadow: 0 1px 4px rgba(0, 0, 0, .2), inset 0 1px 0 rgba(255, 255, 255, .08)
    }

    .tab-btn.active.tab-active {
      color: #7dc87d;
      text-shadow: 0 0 8px rgba(125, 200, 125, .2)
    }

    .tab-btn.active.tab-done {
      color: #7ab0d4;
      text-shadow: 0 0 8px rgba(122, 176, 212, .2)
    }

    /* ── Task Scroll ── */
    #task-scroll {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1px
    }

    #task-scroll::-webkit-scrollbar {
      width: 3px
    }

    #task-scroll::-webkit-scrollbar-track {
      background: transparent
    }

    #task-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .1);
      border-radius: 2px
    }

    /* ── Glass Chips ── */
    #chips {
      display: flex;
      gap: 8px
    }

    .chip {
      flex: 1;
      background: linear-gradient(135deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .015));
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      overflow: hidden
    }

    .chip::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .08), transparent);
      pointer-events: none
    }

    .chip-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, .68);
      letter-spacing: .07em;
      text-transform: uppercase
    }

    .chip-value {
      font-size: 22px;
      font-weight: 600;
      line-height: 1
    }

    .chip-sub {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, .58)
    }

    /* ── Heatmap ── */
    #heatmap-grid {
      display: flex;
      gap: 2px
    }

    .hm-col {
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .hm-cell {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      cursor: default;
      transition: all .2s
    }

    .hm-cell:hover {
      opacity: .85;
      transform: scale(1.4);
      z-index: 10
    }

    /* ── Heatmap Tooltip ── */
    #hm-tooltip {
      position: fixed;
      display: none;
      background: linear-gradient(135deg, rgba(20,20,20,.97), rgba(12,12,12,.98));
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 10px;
      color: rgba(255,255,255,.7);
      z-index: 100;
      pointer-events: none;
      max-width: 200px;
      box-shadow: 0 4px 16px rgba(0,0,0,.5), 0 0 20px rgba(125,200,125,.06);
      backdrop-filter: blur(12px);
    }
    #hm-tooltip .hm-tip-date {
      font-weight: 600;
      color: rgba(255,255,255,.9);
      margin-bottom: 2px;
    }
    #hm-tooltip .hm-tip-count {
      color: #7dc87d;
      font-weight: 600;
      margin-bottom: 4px;
    }
    #hm-tooltip .hm-tip-tasks {
      color: rgba(255,255,255,.45);
      font-size: 9px;
      line-height: 1.4;
    }

    /* ── Footer ── */
    #footer {
      text-align: center
    }

    #footer a {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, .45);
      text-decoration: none;
      transition: color .2s
    }

    #footer a:hover {
      color: #7dc87d;
      text-shadow: 0 0 8px rgba(125, 200, 125, .3)
    }

    #loading {
      text-align: center;
      color: rgba(255, 255, 255, .65);
      font-size: 13px;
      font-weight: 500;
      padding: 20px 0
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .4
      }
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%)
      }

      100% {
        transform: translateX(100%)
      }
    }

    .syncing {
      animation: pulse .6s ease;
      color: #7dc87d !important
    }
  </style>
</head>

<body>
  <div id="card">

    <div id="header">
      <div>
        <div><span id="logo">do.</span><span id="cursor-blink"></span></div>
        <div id="date"></div>
      </div>
      <div style="text-align:right">
        <div style="display:flex;gap:6px;justify-content:flex-end;margin-bottom:4px;align-items:center">
          <button class="ctrl-btn" id="btn-pin" title="Pin on top"></button>
          <button class="ctrl-btn" id="btn-hide" title="Hide to tray"></button>
        </div>
        <div id="clock"></div>
        <button id="sync" title="Refresh">↻ --:--</button>
      </div>
    </div>

    <!-- Quick-add -->
    <div id="add-bar">
      <input id="add-input" placeholder="add task... #tag ~due !priority" autocomplete="off" spellcheck="false" />
      <button id="add-btn" title="Add task">+</button>
    </div>
    <div id="syntax-hint">
      <span>#area</span><span>~today</span><span>!high</span><span>@daily</span>
    </div>

    <!-- Status -->
    <div id="status-bar">
      <span id="conn-status" class="online"><span class="status-dot"></span>connected</span>
      <span id="queue-badge"></span>
    </div>

    <div id="loading">loading stats...</div>
    <div id="content" style="display:none;flex-direction:column;gap:12px">
      <!-- Today -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-label">Today</span>
          <span class="badge warn" id="today-badge">0 left</span>
        </div>
        <div>
          <div class="prog-row"><span id="today-frac">0/0 done</span><span id="today-pct"
              style="color:#7dc87d">0%</span></div>
          <div class="prog-track">
            <div class="prog-fill" id="today-bar" style="width:0%"></div>
          </div>
        </div>
      </div>

      <!-- Task Tabs + List -->
      <div class="panel">
        <div id="tab-bar">
          <button class="tab-btn active tab-active" id="tab-active" onclick="switchTab('active')">Active · 0</button>
          <button class="tab-btn tab-done" id="tab-done" onclick="switchTab('done')">Done · 0</button>
        </div>
        <div id="task-scroll"></div>
      </div>

      <!-- Chips -->
      <div id="chips">
        <div class="chip"><span class="chip-label">Streak</span><span class="chip-value" id="streak-val"
            style="color:#7dc87d">0</span><span class="chip-sub" id="streak-best">best 0</span></div>
        <div class="chip"><span class="chip-label">Week</span><span class="chip-value" id="week-val"
            style="color:#7ab0d4">0/0</span><span class="chip-sub">completed</span></div>
        <div class="chip"><span class="chip-label">Urgent</span><span class="chip-value" id="urgent-val"
            style="color:#555">0</span><span class="chip-sub">high pri</span></div>
      </div>

      <!-- Heatmap -->
      <div class="panel">
        <div class="panel-header"><span class="panel-label">Activity · 12 weeks</span><span id="total-done"
            style="font-size:10px;color:#444">0 total</span></div>
        <div id="heatmap-grid"></div>
      </div>

      <div id="footer"><a href="#" id="open-link">→ open do. <span style="color:#333;font-size:9px">Ctrl+Shift+D
            toggle</span></a></div>
    </div>
  </div>

  <script>
    // ── Config ──
    const SB_URL = 'https://ferfferrviuntjyropsi.supabase.co'
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlcmZmZXJydml1bnRqeXJvcHNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDQyNDAsImV4cCI6MjA5NDQyMDI0MH0.1yctk3yDju2EcupyxnF-sVA7RF7BvxfQ4S8Fp9cYXK0'
    const HC = ['#2a2a2a', '#2d5a2d', '#3d7e3d', '#5aae5a', '#7dc87d']
    const QUEUE_KEY = 'do_offline_queue'

    // ── Offline queue ──
    function getQueue() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]') } catch { return [] } }
    function saveQueue(q) { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)) }
    function enqueue(action) { const q = getQueue(); q.push(action); saveQueue(q); updateQueueBadge() }
    function updateQueueBadge() {
      const q = getQueue()
      const el = document.getElementById('queue-badge')
      el.textContent = q.length > 0 ? `${q.length} queued` : ''
    }

    async function flushQueue() {
      const q = getQueue()
      if (q.length === 0) return
      const remaining = []
      for (const action of q) {
        try {
          if (action.type === 'add') {
            await sbPost('tasks', action.data)
          } else if (action.type === 'complete') {
            await sbPatch('tasks', action.id, { completed: true, completed_at: new Date().toISOString() })
          }
        } catch { remaining.push(action) }
      }
      saveQueue(remaining)
      updateQueueBadge()
      if (remaining.length < q.length) refresh()
    }

    // ── Connectivity ──
    let isOnline = navigator.onLine
    function updateConnStatus() {
      isOnline = navigator.onLine
      const el = document.getElementById('conn-status')
      el.className = isOnline ? 'online' : 'offline'
      el.innerHTML = `<span class="status-dot"></span>${isOnline ? 'connected' : 'offline'}`
      if (isOnline) flushQueue()
    }
    window.addEventListener('online', updateConnStatus)
    window.addEventListener('offline', updateConnStatus)
    updateConnStatus()

    // ── Clock ──
    function updateClock() {
      const n = new Date()
      document.getElementById('clock').textContent = n.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false })
      document.getElementById('date').textContent = n.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })
    }
    updateClock(); setInterval(updateClock, 1000)

    // ── Supabase helpers ──
    const hdrs = { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=representation' }
    async function sbFetch(path) { const r = await fetch(`${SB_URL}/rest/v1/${path}`, { headers: hdrs }); return r.json() }
    async function sbPost(table, data) {
      const r = await fetch(`${SB_URL}/rest/v1/${table}`, { method: 'POST', headers: hdrs, body: JSON.stringify(data) })
      return r.json()
    }
    async function sbPatch(table, id, data) {
      await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, { method: 'PATCH', headers: hdrs, body: JSON.stringify(data) })
    }

    // ── Task parser (port of parseTask.ts) ──
    const DAY_MAP = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6, sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6 }
    function resolveDue(raw) {
      const l = raw.toLowerCase()
      if (l === 'today') return new Date().toISOString().split('T')[0]
      if (l === 'tomorrow' || l === 'tmr') { const d = new Date(); d.setDate(d.getDate() + 1); return d.toISOString().split('T')[0] }
      if (DAY_MAP[l] !== undefined) { const t = new Date(), diff = (DAY_MAP[l] - t.getDay() + 7) % 7 || 7; t.setDate(t.getDate() + diff); return t.toISOString().split('T')[0] }
      if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw
      return null
    }
    function parseTask(input) {
      let title = input.trim(), area = null, due_date = null, priority = 'normal', section = 'today', recurring = null
      const tm = title.match(/#(\w+)/); if (tm) { area = tm[1].toLowerCase(); title = title.replace(tm[0], '').trim() }
      const dm = title.match(/~(\S+)/); if (dm) {
        due_date = resolveDue(dm[1]); title = title.replace(dm[0], '').trim()
        if (due_date) {
          const t = new Date(); t.setHours(0, 0, 0, 0); const diff = Math.ceil((new Date(due_date) - t) / 864e5)
          if (diff <= 0) section = 'today'; else if (diff <= 7) section = 'this_week'; else section = 'someday'
        }
      }
      const pm = title.match(/!(high|low|normal)/); if (pm) { priority = pm[1]; title = title.replace(pm[0], '').trim() }
      const rm = title.match(/@(daily|weekly|monthly)/); if (rm) { recurring = rm[1]; title = title.replace(rm[0], '').trim() }
      title = title.replace(/\s+/g, ' ').trim()
      return { title, area, due_date, priority, section, recurring }
    }

    // ── Add task ──
    async function addTask(input) {
      const p = parseTask(input)
      if (!p.title) return
      const data = { title: p.title, completed: false, section: p.section, priority: p.priority, position: 0 }
      if (p.area) data.area = p.area
      if (p.due_date) data.due_date = p.due_date
      if (p.recurring) data.recurring = p.recurring
      if (!isOnline) { enqueue({ type: 'add', data }); showToast(`queued: ${p.title}`); return }
      try { await sbPost('tasks', data); refresh() } catch { enqueue({ type: 'add', data }); showToast(`queued offline: ${p.title}`) }
    }

    // ── Complete task ──
    async function completeTask(id) {
      if (!isOnline) { enqueue({ type: 'complete', id }); showToast('queued completion'); refresh(); return }
      try { await sbPatch('tasks', id, { completed: true, completed_at: new Date().toISOString() }); refresh() }
      catch { enqueue({ type: 'complete', id }); showToast('queued offline') }
    }

    // ── Toast ──
    function showToast(msg) {
      let t = document.getElementById('toast')
      if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#2d4d2d;color:#7dc87d;font-size:10px;padding:6px 14px;border-radius:6px;z-index:99;transition:opacity .3s;pointer-events:none'; document.body.appendChild(t) }
      t.textContent = msg; t.style.opacity = '1'
      setTimeout(() => { t.style.opacity = '0' }, 2000)
    }

    // ── Heatmap ──
    function buildGrid(data) {
      const map = new Map(data.map(d => [d.date, d.count])), today = new Date(), start = new Date(today)
      start.setFullYear(today.getFullYear() - 1); start.setDate(start.getDate() - start.getDay())
      const cells = [], cur = new Date(start)
      while (cur <= today) { const s = cur.toISOString().split('T')[0], c = map.get(s) ?? 0; cells.push({ date: s, count: c, level: c >= 8 ? 4 : c >= 5 ? 3 : c >= 3 ? 2 : c >= 1 ? 1 : 0 }); cur.setDate(cur.getDate() + 1) }
      return cells
    }
    function computeStreak(data) {
      const map = new Map(data.map(d => [d.date, d.count]))
      let current = 0; const d = new Date()
      while (true) { const s = d.toISOString().split('T')[0]; if ((map.get(s) ?? 0) > 0) { current++; d.setDate(d.getDate() - 1) } else break }
      let longest = 0, run = 0, prev = null; const sorted = [...map.keys()].sort()
      for (const s of sorted) { if ((map.get(s) ?? 0) === 0) { run = 0; prev = null; continue }; if (prev) { run = (new Date(s) - new Date(prev)) / 864e5 === 1 ? run + 1 : 1 } else run = 1; if (run > longest) longest = run; prev = s }
      return { current, longest: Math.max(longest, current) }
    }
    let heatTitleMap = new Map()
    function renderHeatmap(cells) {
      const weeks = []; for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7))
      const last12 = weeks.slice(-12), grid = document.getElementById('heatmap-grid'); grid.innerHTML = ''
      let tip = document.getElementById('hm-tooltip')
      if (!tip) { tip = document.createElement('div'); tip.id = 'hm-tooltip'; document.body.appendChild(tip) }
      for (const week of last12) {
        const col = document.createElement('div'); col.className = 'hm-col'
        for (let i = 0; i < 7; i++) {
          const cell = week[i], div = document.createElement('div'); div.className = 'hm-cell'
          div.style.background = cell ? HC[cell.level] : '#1e1e1e'
          if (cell) {
            div.addEventListener('mouseenter', (e) => {
              const titles = heatTitleMap.get(cell.date) || []
              const dateObj = new Date(cell.date + 'T00:00:00')
              const dateStr = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
              let html = `<div class="hm-tip-date">${dateStr}</div>`
              html += `<div class="hm-tip-count">${cell.count} task${cell.count !== 1 ? 's' : ''} completed</div>`
              if (titles.length > 0) {
                const shown = titles.slice(0, 5)
                html += `<div class="hm-tip-tasks">${shown.map(t => '· ' + t).join('<br>')}`
                if (titles.length > 5) html += `<br>+${titles.length - 5} more`
                html += '</div>'
              }
              tip.innerHTML = html
              tip.style.display = 'block'
              const r = e.target.getBoundingClientRect()
              tip.style.left = Math.min(r.left, window.innerWidth - 210) + 'px'
              tip.style.top = (r.top - tip.offsetHeight - 6) + 'px'
              if (parseInt(tip.style.top) < 4) tip.style.top = (r.bottom + 6) + 'px'
            })
            div.addEventListener('mouseleave', () => { tip.style.display = 'none' })
          }
          col.appendChild(div)
        }
        grid.appendChild(col)
      }
    }

    // ── Tab state ──
    let currentTab = 'active'
    let cachedActive = [], cachedDone = []
    const SEC_LABELS = { today: 'today', this_week: 'week', someday: 'someday' }
    const SEC_ORDER = { today: 0, this_week: 1, someday: 2 }
    const PRI_ORDER = { high: 0, normal: 1, low: 2 }

    function switchTab(tab) {
      currentTab = tab
      document.getElementById('tab-active').className = 'tab-btn' + (tab === 'active' ? ' active tab-active' : '')
      document.getElementById('tab-done').className = 'tab-btn' + (tab === 'done' ? ' active tab-done' : '')
      renderTaskList()
    }

    function renderTaskList() {
      const list = document.getElementById('task-scroll'); list.innerHTML = ''
      const tasks = currentTab === 'active' ? cachedActive : cachedDone
      if (tasks.length === 0) {
        list.innerHTML = `<div style="font-size:11px;color:#444;padding:10px 0;text-align:center">${currentTab === 'active' ? '🎉 No pending tasks!' : 'No completed tasks yet.'}</div>`
        return
      }
      for (const t of tasks) {
        const isDone = currentTab === 'done'
        const row = document.createElement('div'); row.className = 'task-item' + (isDone ? ' completed done-item' : '')
        if (!isDone) { row.onclick = () => completeTask(t.id); row.title = 'Click to complete' }
        const chk = document.createElement('span'); chk.className = 'task-check'; if (isDone) chk.textContent = '✓'
        const title = document.createElement('span'); title.className = 'task-title'; title.textContent = t.title
        row.appendChild(chk)
        if (t.priority === 'high' || t.priority === 'low') { const pri = document.createElement('span'); pri.className = 'task-pri'; pri.style.background = t.priority === 'high' ? '#e06c6c' : '#444'; row.appendChild(pri) }
        row.appendChild(title)
        if (t.area) { const a = document.createElement('span'); a.className = 'task-area'; a.textContent = `#${t.area}`; row.appendChild(a) }
        const sec = document.createElement('span'); sec.className = 'task-section'; sec.textContent = SEC_LABELS[t.section] || t.section; row.appendChild(sec)
        list.appendChild(row)
      }
    }

    // ── Main refresh ──
    let pinned = false
    async function refresh() {
      const syncBtn = document.getElementById('sync')
      syncBtn.classList.add('syncing'); syncBtn.textContent = '↻ syncing...'
      try {
        const [tasks, heatRaw] = await Promise.all([
          sbFetch('tasks?select=*&order=created_at.asc'),
          sbFetch('tasks?select=title,completed_at&completed=eq.true&completed_at=gte.' + new Date(Date.now() - 365 * 24 * 36e5).toISOString()),
        ])
        const top = tasks.filter(t => !t.parent_id)
        const today = top.filter(t => t.section === 'today'), todayDone = today.filter(t => t.completed).length, todayTotal = today.length
        const pct = todayTotal === 0 ? 0 : Math.round(todayDone / todayTotal * 100), left = todayTotal - todayDone
        document.getElementById('today-frac').textContent = `${todayDone}/${todayTotal} done`
        document.getElementById('today-pct').textContent = `${pct}%`
        document.getElementById('today-bar').style.width = `${pct}%`
        const badge = document.getElementById('today-badge')
        if (left === 0 && todayTotal > 0) { badge.textContent = '✓ all done'; badge.className = 'badge done' }
        else { badge.textContent = `${left} left`; badge.className = `badge ${left > 0 ? 'warn' : 'done'}` }

        // Build active and done lists
        cachedActive = top.filter(t => !t.completed).sort((a, b) => {
          const sa = SEC_ORDER[a.section] ?? 3, sb = SEC_ORDER[b.section] ?? 3; if (sa !== sb) return sa - sb
          return (PRI_ORDER[a.priority] ?? 1) - (PRI_ORDER[b.priority] ?? 1)
        })
        cachedDone = top.filter(t => t.completed).sort((a, b) => {
          const ad = a.completed_at ? new Date(a.completed_at).getTime() : 0
          const bd = b.completed_at ? new Date(b.completed_at).getTime() : 0
          return bd - ad
        })
        document.getElementById('tab-active').textContent = `Active · ${cachedActive.length}`
        document.getElementById('tab-done').textContent = `Done · ${cachedDone.length}`
        renderTaskList()

        // Stats
        const cmap = new Map(); heatTitleMap = new Map()
        for (const r of heatRaw) { if (!r.completed_at) continue; const d = r.completed_at.split('T')[0]; cmap.set(d, (cmap.get(d) ?? 0) + 1); if (!heatTitleMap.has(d)) heatTitleMap.set(d, []); heatTitleMap.get(d).push(r.title || 'Untitled') }
        const heatData = [...cmap].map(([date, count]) => ({ date, count }))
        const streak = computeStreak(heatData)
        document.getElementById('streak-val').textContent = streak.current
        document.getElementById('streak-best').textContent = `best ${streak.longest}`
        const weekTasks = top.filter(t => t.section === 'today' || t.section === 'this_week')
        document.getElementById('week-val').textContent = `${weekTasks.filter(t => t.completed).length}/${weekTasks.length}`
        const urgent = top.filter(t => !t.completed && t.priority === 'high').length
        const uel = document.getElementById('urgent-val'); uel.textContent = urgent; uel.style.color = urgent > 0 ? '#e06c6c' : '#555'
        document.getElementById('total-done').textContent = `${top.filter(t => t.completed).length} total`
        renderHeatmap(buildGrid(heatData))
        document.getElementById('loading').style.display = 'none'
        document.getElementById('content').style.display = 'flex'
      } catch (e) { console.error(e) }
      const now = new Date(); syncBtn.classList.remove('syncing')
      syncBtn.textContent = `↻ ${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false })}`
      updateQueueBadge()
    }

    // ── Events ──
    document.getElementById('btn-hide').onclick = () => window.widget?.hide()
    document.getElementById('btn-pin').onclick = () => { pinned = !pinned; window.widget?.pin(pinned); document.getElementById('btn-pin').classList.toggle('active', pinned) }
    document.getElementById('sync').onclick = refresh
    document.getElementById('open-link').onclick = e => { e.preventDefault(); window.widget?.openApp() }
    document.getElementById('add-input').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = e.target.value.trim(); if (v) { addTask(v); e.target.value = '' } }; if (e.key === 'Escape') window.widget?.hide() })
    document.getElementById('add-btn').onclick = () => { const inp = document.getElementById('add-input'), v = inp.value.trim(); if (v) { addTask(v); inp.value = '' } }

    // Focus input on global hotkey toggle
    window.widget?.onFocusInput(() => { setTimeout(() => document.getElementById('add-input')?.focus(), 100) })

    // Boot
    refresh(); setInterval(refresh, 60000); setInterval(() => { if (isOnline) flushQueue() }, 30000)
    updateQueueBadge()

    // ── Squircle (Apple continuous corners) ──
    function applySquircle() {
      const card = document.getElementById('card')
      const w = card.offsetWidth, h = card.offsetHeight, r = 24, n = 5, steps = 16, e = 2 / n
      const p = []
      for (let i = 0; i <= steps; i++) { const t = i / steps; p.push(`${((w - r) + r * Math.pow(t, e)).toFixed(1)}px ${(r - r * Math.pow(1 - t, e)).toFixed(1)}px`) }
      for (let i = 0; i <= steps; i++) { const t = i / steps; p.push(`${((w - r) + r * Math.pow(1 - t, e)).toFixed(1)}px ${((h - r) + r * Math.pow(t, e)).toFixed(1)}px`) }
      for (let i = 0; i <= steps; i++) { const t = i / steps; p.push(`${(r - r * Math.pow(t, e)).toFixed(1)}px ${((h - r) + r * Math.pow(1 - t, e)).toFixed(1)}px`) }
      for (let i = 0; i <= steps; i++) { const t = i / steps; p.push(`${(r - r * Math.pow(1 - t, e)).toFixed(1)}px ${(r - r * Math.pow(t, e)).toFixed(1)}px`) }
      card.style.clipPath = `polygon(${p.join(',')})`
    }
    applySquircle()
    new ResizeObserver(applySquircle).observe(document.getElementById('card'))
  </script>
</body>
